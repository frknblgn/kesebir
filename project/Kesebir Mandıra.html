<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kesebir Mandıra · Cunda Adası</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />

<style>
  :root {
    --cream: #FBF9F5;
    --navy:  #16252C;
    --olive: #4E5E53;
    --stone: #D9CFC1;

    --cream-soft: #F4F1EA;
    --navy-soft: #1F323A;
    --stone-warm: #C8BCAA;
  }

  * { box-sizing: border-box; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--navy);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  h1, h2, h3, h4 {
    font-family: 'Cormorant Garamond', 'Times New Roman', serif;
    font-weight: 400;
    letter-spacing: 0.01em;
    margin: 0;
    color: var(--navy);
  }

  button, input { font-family: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; padding: 0; }
  a { color: inherit; text-decoration: none; }

  ::selection { background: var(--olive); color: var(--cream); }

  /* utility ----------------------------------------------------------- */
  .mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 500;
  }
  .rule {
    height: 1px;
    background: var(--stone);
    border: 0;
  }

  /* buttons ----------------------------------------------------------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 26px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-radius: 2px;
    transition: all 420ms;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .btn-primary { background: var(--navy); color: var(--cream); border-color: var(--navy); }
  .btn-primary:hover { background: var(--olive); border-color: var(--olive); }
  .btn-ghost { background: transparent; color: currentColor; border-color: currentColor; }
  .btn-ghost:hover { background: rgba(255,255,255,0.08); }
  .btn-outline { background: transparent; color: var(--navy); border-color: var(--navy); }
  .btn-outline:hover { background: var(--navy); color: var(--cream); }

  /* placeholders that suggest dark photography ------------------------ */
  .ph {
    position: relative;
    overflow: hidden;
    background: var(--navy);
    color: var(--cream);
    isolation: isolate;
  }
  .ph::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 80% at 30% 20%, rgba(217,207,193,0.18), transparent 55%),
      radial-gradient(80% 120% at 80% 90%, rgba(78,94,83,0.55), transparent 60%),
      linear-gradient(140deg, #0F1B21 0%, #16252C 45%, #233640 100%);
    z-index: -2;
  }
  .ph::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(45deg, rgba(217,207,193,0.04) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,0.25) 0 1px, transparent 1px 9px);
    mix-blend-mode: overlay;
    z-index: -1;
    opacity: 0.7;
  }
  .ph .ph-label {
    position: absolute;
    bottom: 14px;
    left: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--stone);
    opacity: 0.65;
    text-transform: uppercase;
  }
  .ph.warm::before {
    background:
      radial-gradient(100% 70% at 20% 30%, rgba(217,207,193,0.30), transparent 60%),
      linear-gradient(160deg, #2A2017 0%, #3A2C20 50%, #1C140E 100%);
  }
  .ph.olive::before {
    background:
      radial-gradient(120% 80% at 70% 30%, rgba(217,207,193,0.20), transparent 55%),
      linear-gradient(140deg, #2A332B 0%, #3D4B3F 50%, #1B221C 100%);
  }
  .ph.stone::before {
    background:
      radial-gradient(120% 80% at 30% 30%, rgba(255,255,255,0.30), transparent 55%),
      linear-gradient(150deg, #C8BCAA 0%, #D9CFC1 50%, #A89C88 100%);
  }
  .ph.stone .ph-label { color: var(--navy); opacity: 0.55; }

  /* layout primitives ------------------------------------------------- */
  .container {
    width: min(1280px, 100% - 48px);
    margin: 0 auto;
  }
  @media (min-width: 1024px) {
    .container { width: min(1280px, 100% - 96px); }
  }

  /* loading skeleton until React hydrates ----------------------------- */
  .boot {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--olive);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 20px;
    letter-spacing: 0.04em;
  }

  /* scrollbar minor tweak */
  html { scroll-behavior: smooth; }
</style>
</head>
<body>
  <div id="root"><div class="boot">Cunda esintisi geliyor…</div></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/nav.jsx"></script>
  <script type="text/babel" src="src/hero.jsx"></script>
  <script type="text/babel" src="src/products.jsx"></script>
  <script type="text/babel" src="src/story.jsx"></script>
  <script type="text/babel" src="src/cart.jsx"></script>
  <script type="text/babel" src="src/footer.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
