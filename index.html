<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kesebir Mandıra · Cunda Adası</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />

<style>
/* ── tokens ─────────────────────────────────────────────────────────────── */
:root {
  --cream:      #FBF9F5;
  --navy:       #16252C;
  --olive:      #4E5E53;
  --stone:      #D9CFC1;
  --cream-soft: #F4F1EA;
  --navy-soft:  #1F323A;
  --stone-warm: #C8BCAA;
}

/* ── reset ──────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; transition-timing-function: cubic-bezier(0.4,0,0.2,1); }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--cream);
  color: var(--navy);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 {
  font-family: 'Cormorant Garamond', 'Times New Roman', serif;
  font-weight: 400;
  letter-spacing: 0.01em;
  margin: 0;
  color: var(--navy);
}
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--olive); color: var(--cream); }

/* ── utility ─────────────────────────────────────────────────────────────── */
.mono {
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.eyebrow {
  font-family: 'Inter', sans-serif;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-weight: 500;
}
.rule { height: 1px; background: var(--stone); border: 0; }

/* ── buttons ─────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 15px 26px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border-radius: 2px;
  transition: all 420ms;
  cursor: pointer;
  border: 1px solid transparent;
}
.btn-primary { background: var(--navy); color: var(--cream); border-color: var(--navy); }
.btn-primary:hover { background: var(--olive); border-color: var(--olive); }
.btn-ghost { background: transparent; color: currentColor; border-color: currentColor; }
.btn-ghost:hover { background: rgba(255,255,255,0.08); }
.btn-outline { background: transparent; color: var(--navy); border-color: var(--navy); }
.btn-outline:hover { background: var(--navy); color: var(--cream); }

/* ── photo placeholders ──────────────────────────────────────────────────── */
.ph {
  position: relative;
  overflow: hidden;
  background: var(--navy);
  color: var(--cream);
  isolation: isolate;
}
.ph::before {
  content: "";
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 80% at 30% 20%, rgba(217,207,193,0.18), transparent 55%),
    radial-gradient(80% 120% at 80% 90%, rgba(78,94,83,0.55), transparent 60%),
    linear-gradient(140deg, #0F1B21 0%, #16252C 45%, #233640 100%);
  z-index: -2;
}
.ph::after {
  content: "";
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(45deg, rgba(217,207,193,0.04) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,0.25) 0 1px, transparent 1px 9px);
  mix-blend-mode: overlay;
  z-index: -1;
  opacity: 0.7;
}
.ph .ph-label {
  position: absolute;
  bottom: 14px; left: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--stone);
  opacity: 0.65;
  text-transform: uppercase;
}
.ph.warm::before {
  background:
    radial-gradient(100% 70% at 20% 30%, rgba(217,207,193,0.30), transparent 60%),
    linear-gradient(160deg, #2A2017 0%, #3A2C20 50%, #1C140E 100%);
}
.ph.olive::before {
  background:
    radial-gradient(120% 80% at 70% 30%, rgba(217,207,193,0.20), transparent 55%),
    linear-gradient(140deg, #2A332B 0%, #3D4B3F 50%, #1B221C 100%);
}
.ph.stone::before {
  background:
    radial-gradient(120% 80% at 30% 30%, rgba(255,255,255,0.30), transparent 55%),
    linear-gradient(150deg, #C8BCAA 0%, #D9CFC1 50%, #A89C88 100%);
}
.ph.stone .ph-label { color: var(--navy); opacity: 0.55; }

/* ── layout ──────────────────────────────────────────────────────────────── */
.container {
  width: min(1280px, 100% - 48px);
  margin: 0 auto;
}
@media (min-width: 1024px) {
  .container { width: min(1280px, 100% - 96px); }
}

/* ── boot screen ─────────────────────────────────────────────────────────── */
.boot {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--olive);
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 20px;
  letter-spacing: 0.04em;
}

/* ── nav ─────────────────────────────────────────────────────────────────── */
.kb-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  transition: background 420ms, border-color 420ms, color 420ms;
  color: var(--cream);
  border-bottom: 1px solid transparent;
}
.kb-nav.scrolled {
  background: rgba(251,249,245,0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: var(--navy);
  border-bottom-color: var(--stone);
}
.kb-nav-inner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 0; gap: 24px;
}
.kb-nav-center { display: flex; align-items: center; gap: 4px; }
.kb-nav-item {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 14px;
  font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
  font-weight: 500;
  position: relative;
}
.kb-nav-item:hover { color: var(--stone); }
.kb-nav.scrolled .kb-nav-item:hover { color: var(--olive); }
.kb-nav-item.active { color: var(--olive); }
.kb-nav-right { display: flex; align-items: center; gap: 4px; }
.kb-icon-btn {
  width: 40px; height: 40px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 2px;
  transition: background 420ms, color 420ms;
  position: relative;
}
.kb-icon-btn:hover { background: rgba(217,207,193,0.18); }
.kb-cart-badge {
  position: absolute; top: 4px; right: 2px;
  min-width: 18px; height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--olive);
  color: var(--cream);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  display: inline-flex; align-items: center; justify-content: center;
}
.kb-cart-badge.pulse { animation: kbPulse 600ms ease-out; }
@keyframes kbPulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.45); background: var(--cream); color: var(--navy); }
  100% { transform: scale(1); }
}

/* dropdown */
.kb-drop-wrap {
  position: absolute; left: 50%; top: 100%;
  transform: translateX(-50%);
  padding-top: 18px;
  pointer-events: none;
  opacity: 0; transition: opacity 320ms;
}
.kb-drop-wrap.show { opacity: 1; pointer-events: auto; }
.kb-dropdown {
  background: var(--cream);
  color: var(--navy);
  border: 1px solid var(--stone);
  border-radius: 2px;
  padding: 28px 32px;
  width: 460px;
  box-shadow: 0 24px 60px rgba(22,37,44,0.08);
}
.kb-dropdown-row {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--cream-soft);
  transition: padding 320ms, color 320ms;
}
.kb-dropdown-row:hover { padding-left: 8px; color: var(--olive); }

@media (max-width: 900px) {
  .kb-nav-center, .kb-nav-right .desk-only { display: none; }
  .kb-mobile-btn { display: inline-flex !important; }
}
.kb-mobile-btn { display: none; }

/* mobile overlay */
.kb-mobile-overlay {
  position: fixed; inset: 0; z-index: 70;
  background: var(--navy); color: var(--cream);
  padding: 28px;
  transform: translateY(-100%);
  transition: transform 480ms, visibility 0s linear 480ms;
  display: flex; flex-direction: column;
  overflow: hidden;
  visibility: hidden;
}
.kb-mobile-overlay.open {
  transform: translateY(0);
  visibility: visible;
  transition: transform 480ms, visibility 0s;
}

/* ── hero ────────────────────────────────────────────────────────────────── */
.kb-hero {
  position: relative;
  min-height: 100vh;
  color: var(--cream);
  overflow: hidden;
  isolation: isolate;
  display: flex;
  flex-direction: column;
}
.kb-hero-bg {
  position: absolute; inset: 0; z-index: -3;
  background:
    radial-gradient(80% 60% at 70% 30%, rgba(78,94,83,0.45), transparent 60%),
    radial-gradient(60% 80% at 20% 80%, rgba(217,207,193,0.10), transparent 60%),
    linear-gradient(160deg, #0C1418 0%, #16252C 50%, #1F323A 100%);
}
.kb-hero-grain {
  position: absolute; inset: 0; z-index: -2;
  background-image:
    repeating-linear-gradient(45deg, rgba(217,207,193,0.03) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,0.3) 0 1px, transparent 1px 7px);
  mix-blend-mode: overlay;
  opacity: 0.7;
}
.kb-hero-orb {
  position: absolute; z-index: -1; pointer-events: none;
  width: 720px; height: 720px; border-radius: 50%;
  right: -200px; top: -120px;
  background: radial-gradient(circle, rgba(217,207,193,0.18) 0%, rgba(217,207,193,0) 60%);
  animation: kbDrift 14s ease-in-out infinite alternate;
}
@keyframes kbDrift {
  0%   { transform: translate(0,0) scale(1); }
  100% { transform: translate(-40px, 30px) scale(1.06); }
}
.kb-hero-top {
  padding-top: 140px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: end;
  gap: 32px;
}
.kb-hero-coord {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--stone); opacity: 0.7;
}
.kb-hero-body {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px 0 80px;
}
.kb-hero-content { text-align: center; max-width: 980px; margin: 0 auto; }
.kb-hero-eyebrow {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 18px;
  color: var(--stone);
  letter-spacing: 0.02em;
  margin-bottom: 28px;
  display: inline-flex;
  align-items: center;
  gap: 18px;
}
.kb-hero-eyebrow::before, .kb-hero-eyebrow::after {
  content: ""; width: 36px; height: 1px; background: var(--stone); opacity: 0.5;
}
.kb-hero-h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 400;
  font-size: clamp(48px, 8vw, 112px);
  line-height: 0.98;
  letter-spacing: -0.005em;
  color: var(--cream);
  margin: 0 0 8px;
}
.kb-hero-h1 em { font-style: italic; color: var(--stone); font-weight: 400; }
.kb-hero-sub {
  font-size: 17px; line-height: 1.7;
  color: var(--cream); opacity: 0.78;
  max-width: 560px;
  margin: 32px auto 44px;
}
.kb-hero-ctas { display: inline-flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

/* panoramic banner */
.kb-hero-pano {
  position: relative;
  margin-bottom: 36px;
  overflow: hidden;
  mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
}
.kb-hero-pano-track {
  display: flex; gap: 14px;
  width: max-content;
  animation: kbPano 60s linear infinite;
}
@keyframes kbPano {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.kb-hero-pano-cell {
  width: 240px; height: 130px;
  flex-shrink: 0;
  position: relative;
  border: 1px solid rgba(217,207,193,0.18);
  border-radius: 2px;
  overflow: hidden;
}
.kb-hero-pano-cell .ph-label { font-size: 9px; opacity: 0.6; letter-spacing: 0.14em; }
.kb-hero-pano-frame {
  position: absolute; top: 8px; right: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.14em;
  color: var(--stone); opacity: 0.55;
}
.kb-hero-pano-cell::after {
  content: "";
  position: absolute; inset: 0;
  border: 1px solid transparent;
  pointer-events: none;
  background:
    linear-gradient(to right, rgba(217,207,193,0.15) 0 1px, transparent 1px) 0 0/40px 100%,
    linear-gradient(to bottom, rgba(217,207,193,0.10) 0 1px, transparent 1px) 0 0/100% 40px;
  mix-blend-mode: overlay;
  opacity: 0.5;
}
@media (max-width: 720px) {
  .kb-hero-pano-cell { width: 180px; height: 110px; }
}
.kb-hero-bottom {
  padding-bottom: 36px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: end;
  gap: 24px;
}
.kb-scroll {
  display: inline-flex; flex-direction: column; align-items: center;
  gap: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--stone);
  justify-self: center;
}
.kb-scroll-line {
  width: 1px; height: 56px;
  background: linear-gradient(to bottom, var(--stone), transparent);
  position: relative; overflow: hidden;
}
.kb-scroll-line::after {
  content: "";
  position: absolute; left: 0; top: -100%;
  width: 100%; height: 100%;
  background: var(--cream);
  animation: kbScroll 2.2s ease-in-out infinite;
}
@keyframes kbScroll {
  0%   { top: -100%; }
  70%  { top: 110%; }
  100% { top: 110%; }
}
.kb-vert {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--stone); opacity: 0.6;
}
.kb-feature-strip {
  display: flex; gap: 24px; align-items: center;
  color: var(--stone);
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  justify-content: flex-end;
}
.kb-feature-strip span { opacity: 0.8; }
@media (max-width: 720px) {
  .kb-hero-top, .kb-hero-bottom { grid-template-columns: 1fr; }
  .kb-feature-strip { justify-content: flex-start; flex-wrap: wrap; }
  .kb-hero-eyebrow::before, .kb-hero-eyebrow::after { width: 18px; }
}

/* ── products ────────────────────────────────────────────────────────────── */
.kb-products { padding: 120px 0 100px; background: var(--cream); }
@media (max-width: 720px) { .kb-products { padding: 72px 0 60px; } }

.kb-prod-head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: end; gap: 32px; margin-bottom: 56px;
}
@media (max-width: 900px) { .kb-prod-head { grid-template-columns: 1fr; gap: 18px; } }
.kb-prod-h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(40px, 5vw, 72px);
  line-height: 1.02; letter-spacing: -0.005em;
}
.kb-prod-h2 em { font-style: italic; color: var(--olive); }
.kb-prod-eye {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--olive);
}
.kb-prod-desc {
  max-width: 320px; color: var(--navy); opacity: 0.7;
  font-size: 14px; line-height: 1.7;
}

.kb-chips {
  display: flex; gap: 8px;
  padding: 28px 0;
  border-top: 1px solid var(--stone);
  border-bottom: 1px solid var(--stone);
  margin-bottom: 56px;
  overflow-x: auto; scrollbar-width: none;
}
.kb-chips::-webkit-scrollbar { display: none; }
.kb-chip {
  flex-shrink: 0;
  padding: 10px 18px;
  font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500;
  color: var(--navy); background: transparent;
  border: 1px solid var(--stone); border-radius: 2px;
  transition: all 400ms;
}
.kb-chip:hover { border-color: var(--olive); color: var(--olive); }
.kb-chip.active { background: var(--olive); color: var(--cream); border-color: var(--olive); }
.kb-chip-count {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--olive); padding: 8px 0; flex-shrink: 0;
}

.kb-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px 32px;
}
@media (max-width: 1024px) { .kb-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px)  { .kb-grid { grid-template-columns: 1fr; } }

/* card */
.kb-card {
  position: relative;
  transition: transform 420ms;
  will-change: transform;
  opacity: 0;
  animation: kbFadeIn 520ms forwards;
}
@keyframes kbFadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.kb-card:hover { transform: translateY(-6px); }
.kb-card-img {
  position: relative; aspect-ratio: 4/5;
  width: 100%; border-radius: 2px;
  border: 1px solid var(--stone); overflow: hidden;
}
.kb-card-num { position: absolute; top: 14px; right: 16px; color: var(--stone); opacity: 0.7; }
.kb-card-badges {
  position: absolute; top: 14px; left: 16px;
  display: flex; gap: 6px; flex-wrap: wrap; max-width: 70%;
}
.kb-badge {
  padding: 5px 10px;
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--cream); background: rgba(78,94,83,0.65);
  border: 1px solid rgba(217,207,193,0.25);
  backdrop-filter: blur(8px); border-radius: 2px;
}
.kb-card.stone .kb-badge { color: var(--navy); background: rgba(22,37,44,0.10); border-color: rgba(22,37,44,0.15); }
.kb-card-pairing {
  position: absolute; left: 16px; right: 16px; bottom: 90px;
  display: flex; flex-direction: column;
  opacity: 0; transform: translateY(8px);
  transition: opacity 420ms, transform 420ms;
}
.kb-card:hover .kb-card-pairing { opacity: 1; transform: translateY(0); }
.kb-card-action {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  padding: 12px;
  background: rgba(22,37,44,0.85);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(217,207,193,0.18);
  border-radius: 2px; color: var(--cream);
  display: flex; flex-direction: column; gap: 10px;
  transform: translateY(calc(100% + 16px));
  opacity: 0;
  transition: transform 480ms, opacity 320ms;
}
.kb-card:hover .kb-card-action { transform: translateY(0); opacity: 1; }
.kb-variants { display: flex; gap: 4px; }
.kb-variant {
  flex: 1; padding: 8px;
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--cream); background: transparent;
  border: 1px solid rgba(217,207,193,0.3); border-radius: 2px;
  transition: all 320ms;
}
.kb-variant:hover { border-color: var(--stone); }
.kb-variant.active { background: var(--olive); border-color: var(--olive); }
.kb-add {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; background: var(--cream); color: var(--navy);
  font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 500;
  border-radius: 2px; transition: background 320ms, color 320ms;
}
.kb-add:hover { background: var(--stone); }
.kb-add-price { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
.kb-card-meta { padding: 18px 4px 0; display: flex; flex-direction: column; gap: 14px; }
.kb-card-head { display: flex; align-items: start; justify-content: space-between; gap: 16px; }
.kb-card-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px; letter-spacing: 0.005em; line-height: 1.2; color: var(--navy); margin: 0 0 4px;
}
.kb-card-sub { font-size: 13px; color: var(--olive); margin: 0; }
.kb-card-rating {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--navy); padding-top: 4px;
}
.kb-card-foot {
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 14px; border-top: 1px solid var(--stone);
}
.kb-card-price { font-family: 'Cormorant Garamond', serif; font-size: 18px; }

/* ── story ───────────────────────────────────────────────────────────────── */
.kb-story { background: var(--cream-soft); padding: 140px 0 100px; position: relative; }
@media (max-width: 720px) { .kb-story { padding: 80px 0 60px; } }
.kb-story-grid {
  display: grid; grid-template-columns: 1.5fr 1fr; gap: 80px; align-items: stretch;
}
@media (max-width: 1024px) { .kb-story-grid { grid-template-columns: 1fr; gap: 56px; } }
.kb-story-left {
  position: relative; aspect-ratio: 4/5; min-height: 540px;
  overflow: hidden; border: 1px solid var(--stone); border-radius: 2px;
}
.kb-story-left .ph-label { color: var(--stone); }

function App() {
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [scrolled, setScrolled] = useState(false);
  const [pulse, setPulse] = useState(false);
  const pulseTimer = useRef(null);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 80);
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  useEffect(() => {
    document.body.style.overflow = cartOpen ? "hidden" : "";
  }, [cartOpen]);

  const totalQty = cart.reduce((s, it) => s + it.qty, 0);

  const handleAdd = (product, variant) => {
    const key = product.id + ":" + variant.w;
    setCart(prev => {
      const i = prev.findIndex(it => it.key === key);
      if (i >= 0) {
        const next = [...prev];
        next[i] = { ...next[i], qty: next[i].qty + 1 };
        return next;
      }
      return [...prev, { key, id: product.id, name: product.name, weight: variant.w, price: variant.price, qty: 1, ph: product.ph }];
    });
    setCartOpen(true);
    setPulse(true);
    clearTimeout(pulseTimer.current);
    pulseTimer.current = setTimeout(() => setPulse(false), 700);
  };

  const handleQty = (key, delta) =>
    setCart(prev => prev.map(it => it.key === key ? { ...it, qty: it.qty + delta } : it).filter(it => it.qty > 0));

  const handleRemove = (key) => setCart(prev => prev.filter(it => it.key !== key));

  return (
    <>
      <Nav cartCount={{ n: totalQty, pulse }} onOpenCart={() => setCartOpen(true)} scrolled={scrolled} />
      <Hero />
      <Products onAdd={handleAdd} />
      <Story />
      <Footer />
      <Cart open={cartOpen} items={cart} onClose={() => setCartOpen(false)} onQty={handleQty} onRemove={handleRemove} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
